services:
  - type: web
    name: rupeeradar-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000

  - type: background
    name: rupeeradar-simulator
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python scripts/simulate_live_stream.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: INGEST_URL
        value: "https://rupeeradar-backend.onrender.com/api/v1/complaints/ingest"
